name: path_gen
description: "All in one generator for your asset paths with support to transform .svg to .vec(opt-in)."
repository: https://github.com/arjablc/path_gen
issue_tracker: https://github.com/arjablc/path_gen/issues

version: 1.4.2
topics:
  - asset
  - generation
  - vector

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.7.0
  crypto: ^3.0.3
  path: ^1.9.0
  vector_graphics_compiler: ^1.1.16
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.15
