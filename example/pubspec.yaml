name: path_gen_example
description: Example project demonstrating path_gen usage

publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_gen:
    path: ../
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

path_gen:
  input: assets
  output: lib/assets
  generate_all_getter: true
  transform_svg_to_vec: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
